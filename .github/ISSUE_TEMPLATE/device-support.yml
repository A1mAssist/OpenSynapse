name: Device support request
description: Help adapt or complete support for a Razer device with identity and read-only protocol evidence.
title: "[Device support] "
body:
  - type: markdown
    attributes:
      value: |
        Read [docs/DEVICE_ADAPTATION.md](https://github.com/A1mAssist/OpenSynapse/blob/main/docs/DEVICE_ADAPTATION.md) before submitting.

        Do not upload Razer proprietary JavaScript, DLLs, drivers, firmware, installers, serial numbers, account data, or raw captures to this public issue. If you use the collector, send the ZIP through a temporary link and remove it after review.

  - type: input
    id: model
    attributes:
      label: Device model
      description: Use the exact retail model name.
      placeholder: Razer Blade 15 (Mid 2019)
    validations:
      required: true

  - type: input
    id: sku
    attributes:
      label: SKU or model number
      placeholder: RZ09-03006
    validations:
      required: true

  - type: input
    id: usb_pid
    attributes:
      label: USB VID:PID
      description: Find it in Windows Device Manager or the OpenSynapse diagnostics page.
      placeholder: "1532:0246"
    validations:
      required: true

  - type: input
    id: windows_build
    attributes:
      label: Windows version and build
      placeholder: Windows 11 24H2, build 26100.x
    validations:
      required: true

  - type: input
    id: synapse_version
    attributes:
      label: Razer Synapse version
      placeholder: Razer Synapse 4.x / AppEngine 4.x
    validations:
      required: false

  - type: dropdown
    id: openrazer_status
    attributes:
      label: OpenRazer catalog status
      description: Check docs/SUPPORTED_DEVICES.md before answering.
      options:
        - Listed, but the requested capability is missing
        - Not listed
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: requested_controls
    attributes:
      label: Controls to prioritize
      description: Select the capabilities you actually want tested first.
      options:
        - label: Performance mode
        - label: Fan speed or fan curve
        - label: Keyboard lighting
        - label: Logo lighting
        - label: Battery or charge limit
        - label: DPI or polling rate
        - label: Button mapping or onboard profile
        - label: Other (describe below)

  - type: dropdown
    id: testing
    attributes:
      label: Can you test temporary builds?
      options:
        - "Yes, I can test read-only and write/restore builds"
        - "Yes, but read-only tests only"
        - "No, I can only provide information"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Collector output
      description: Paste the manifest summary or a temporary download link. Do not paste proprietary JavaScript or a full installer.
      placeholder: |
        Collector result:
        Zip path / temporary link:
        Matched files:
        Relevant capabilities:
    validations:
      required: false

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior and requested result
      description: Explain what Synapse can do, what OpenSynapse currently does, and what you want to work.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include serial numbers, account data, tokens, a full Razer installer, or unreviewed raw captures.
          required: true